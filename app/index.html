<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Raseed — Prototype</title>
  <meta name="description" content="Try the Raseed prototype: track orders and customers and create invoices for your home business. Everything stays in your browser.">
  <meta name="theme-color" content="#1F5C5A">

  <!-- The app may only talk to its own site (plus Google Fonts for the fonts).
       This guarantees that orders, customers and accounts never leave the browser.
       Do not add analytics or the Meta Pixel here. -->
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src https://fonts.gstatic.com; img-src 'self' data: blob:; connect-src 'self'; form-action 'none'; base-uri 'self'; object-src 'none'">

  <link rel="icon" href="../favicon.ico" sizes="32x32">
  <link rel="icon" href="../assets/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="../assets/apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300..600;1,9..144,300..500&family=IBM+Plex+Sans+Arabic:wght@400;500;600&family=Inter:wght@400;500;600&display=swap">

  <link rel="stylesheet" href="css/tokens.css">
  <link rel="stylesheet" href="css/app.css">
  <script type="module" src="js/main.js"></script>
</head>

  <div id="app" class="boot">
    <svg class="boot__mark" viewBox="0 0 523 523" aria-hidden="true">

  </noscript>
</body>
</html>
